name: Android APK

# Elle başlatılabilir (Actions sekmesi → Run workflow) ve uygulama kodu değişince kendiliğinden çalışır.
on:
  workflow_dispatch:
  push:
    branches: [claude/tender-allen-q2472v]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Test amaçlı: debug anahtarıyla imzalı yayın sürümü (telefona doğrudan kurulur).
      # Play Store için ayrıca kendi imza anahtarımız kurulacak.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tavas-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
