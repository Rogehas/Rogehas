name: tavas
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  google_fonts: ^6.3.3
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Uygulama ikonu ve açılış ekranı (kaynaklar: assets/branding/). Yeniden üretmek için:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: assets/branding/icon_bg.png
  adaptive_icon_foreground: assets/branding/icon_fg.png
  min_sdk_android: 23
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#B00A1E"
  color_dark: "#B00A1E"
  image: assets/branding/splash_figure.png
  android_12:
    color: "#B00A1E"
    color_dark: "#B00A1E"
    image: assets/branding/icon_fg.png
  android: true
  ios: false
  web: false
